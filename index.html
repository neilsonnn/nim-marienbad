<style>
  :root { --ink: #ece9e2; --dim: rgba(236, 233, 226, 0.55); color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { font-family: 'Cormorant Garamond', 'EB Garamond', Garamond, Georgia, 'Times New Roman', serif; color: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas#c { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; cursor: default; }
  canvas#c.pointing { cursor: pointer; }
  .ov { position: fixed; pointer-events: none; transition: opacity 1.4s ease; }
  /* The opening frame, rendered by the game itself (?opening, nim.opening()), shown at
     once and faded into the live scene; the script after #still sizes it to match. */
  #still { inset: 0; background: #000 url(docs/opening-wide.jpg) center / cover no-repeat; opacity: 1; transition-duration: 0.25s; }
  #still.gone { opacity: 0; }
  /* loading: a thin bar along the bottom edge */
  #loading { left: 0; right: 0; bottom: 0; height: 2px; opacity: 1; transition-duration: 0.15s; }
  #loading b { position: absolute; inset: 0; background: rgba(236,233,226,0.7); transform: scaleX(0.04); transform-origin: left; transition: transform 7s cubic-bezier(0.1, 0.6, 0.2, 1); }
  #loading.go b { transform: scaleX(0.88); }
  #loading.done b { transform: scaleX(1); transition-duration: 0.1s; }
  #loading.gone { opacity: 0; }
  #title { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 max(24px, env(safe-area-inset-left)); opacity: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0.5), rgba(0,0,0,0.85)); transition-duration: 0.6s; }
  #title.show { opacity: 1; pointer-events: auto; }
  #title h1 { margin: 0; font-weight: 300; font-size: clamp(3rem, 11vw, 7rem); letter-spacing: 0.42em; padding-left: 0.42em; line-height: 1; }
  #title p span { display: block; text-wrap: balance; }
  #title p { margin: 1.4em 0 0; max-width: 30em; font-size: clamp(1rem, 2.6vw, 1.25rem); line-height: 1.55; color: var(--dim); font-style: italic; }
  #title .modes { margin-top: 2.2em; display: flex; gap: 2.2em; justify-content: center; flex-wrap: wrap; }
  #title .mode { opacity: 0.6; font-size: clamp(1rem, 2.4vw, 1.2rem); letter-spacing: 0.22em; padding: 0.4em 0.2em 0.3em; border-bottom: 1px solid transparent; transition: opacity 0.3s ease, border-color 0.3s ease; }
  #title .mode:hover, #title .mode.pick { opacity: 1; border-bottom-color: rgba(236,233,226,0.5); }
  #title .mode:focus-visible, #gear:focus-visible { outline: 1px dotted var(--dim); outline-offset: 4px; }
  #title.show .mode { pointer-events: auto; }
  #title .credit { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(max(4.2vh, 28px) + env(safe-area-inset-bottom)); width: min(92vw, 40em); font-size: clamp(0.95rem, 2.1vw, 1.15rem); font-style: italic; color: var(--dim); line-height: 1.45; }
  #title .credit cite { font-style: normal; }
  #title .credit a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(236,233,226,0.35); pointer-events: auto; transition: border-color 0.3s ease; }
  #title .credit a:hover { border-bottom-color: var(--ink); }
  #title .credit a:focus-visible { outline: 1px dotted var(--dim); outline-offset: 4px; }
  body.settings #sub, body.settings .btns, body.settings #speed { opacity: 0 !important; visibility: hidden; transition: none; }
  #gear { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); right: calc(12px + env(safe-area-inset-right)); width: 40px; height: 40px; padding: 11px; opacity: 0.45; pointer-events: auto; transition: opacity 0.3s ease; z-index: 2; }
  #gear:hover, #gear[aria-expanded="true"] { opacity: 0.95; }
  #gear svg { width: 100%; height: 100%; display: block; }
  #touch-orbit { display: none; position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); z-index: 2; min-height: 44px; padding: 0 12px; border: 1px solid #ece9e266; border-radius: 5px; background: #181818e0; letter-spacing: 0.04em; }
  #touch-orbit[aria-pressed="true"] { background: var(--ink); color: #181818; }
  @media (any-pointer: coarse) { body:not(.settings) #touch-orbit:not([hidden]) { display: block; } }
  /* the debug button: beside the ? while the settings are open; shows the animation rig */
  #debug { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); right: calc(56px + env(safe-area-inset-right)); width: 40px; height: 40px; padding: 10px; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s; z-index: 2; }
  body.settings #debug { opacity: 0.45; visibility: visible; pointer-events: auto; }
  body.settings #debug:hover, body.settings #debug[aria-pressed="true"] { opacity: 0.95; }
  #debug svg { width: 100%; height: 100%; display: block; }
  #debug:focus-visible { outline: 1px dotted var(--dim); outline-offset: 4px; }
  #speed { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); right: calc(56px + env(safe-area-inset-right)); height: 40px; min-width: 40px; padding: 0 6px; font-size: 1.15rem; letter-spacing: 0.05em; font-variant-numeric: lining-nums tabular-nums; z-index: 2; }
  #speed.show { opacity: 0.45; }
  #speed.show:hover { opacity: 0.95; }
  #speed:focus-visible { outline: 1px dotted var(--dim); outline-offset: 4px; }
  #sub { left: 50%; bottom: calc(max(4.2vh, 28px, var(--frame-bottom, 0px) * 0.55) + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(92vw, 40em); text-align: center; font-size: clamp(1.05rem, 2.4vw, 1.45rem); font-style: italic; text-shadow: 0 0 6px #000, 0 0 2px #000; opacity: 0; transition-duration: 0.7s; }
  #sub.show { opacity: 1; }
  .btns { position: fixed; left: 50%; transform: translateX(-50%); white-space: nowrap; bottom: calc(max(10vh, 74px, var(--frame-bottom, 0px) * 0.55 + 46px) + env(safe-area-inset-bottom)); display: flex; gap: 1.2em; align-items: baseline; }
  button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0.55em 0.9em; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; letter-spacing: 0.18em; }
  button.show { opacity: 1; pointer-events: auto; }
  #take { font-size: clamp(1.15rem, 2.6vw, 1.4rem); border-bottom: 1px solid rgba(236,233,226,0.5); padding-bottom: 0.25em; }
  #take:hover { border-bottom-color: var(--ink); }
  #clear { font-size: 0.95rem; color: var(--dim); font-style: italic; }
  #protest { font-size: clamp(1.05rem, 2.3vw, 1.3rem); font-style: italic; border-bottom: 1px solid rgba(236,233,226,0.5); padding-bottom: 0.25em; }
  #protest:hover { border-bottom-color: var(--ink); }
  /* centred on its own: clear and take keep their (invisible) place in the row */
  #protest { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); white-space: nowrap; }
  #take:focus-visible, #clear:focus-visible, #protest:focus-visible { outline: 1px dotted var(--dim); outline-offset: 4px; }
  /* phones: the prompt sits on the same row as the buttons in the corner (centred
     between equal margins, growing upward if it wraps); the title card stacks */
  @media (max-width: 600px) {
    #sub { left: calc(60px + env(safe-area-inset-left)); right: calc(60px + env(safe-area-inset-right)); width: auto; transform: none; bottom: calc(10px + env(safe-area-inset-bottom)); min-height: 40px; display: flex; align-items: center; justify-content: center; line-height: 1.25; }
    body:has(#speed.show) #sub { left: calc(104px + env(safe-area-inset-left)); right: calc(104px + env(safe-area-inset-right)); }
    .btns { bottom: calc(64px + env(safe-area-inset-bottom)); gap: 0.6em; }
    #take { font-size: 1.1rem; }
    #title .modes { flex-direction: column; align-items: center; gap: 0.5em; }
    #title .credit { left: calc(60px + env(safe-area-inset-left)); right: calc(60px + env(safe-area-inset-right)); width: auto; transform: none; bottom: calc(10px + env(safe-area-inset-bottom)); min-height: 40px; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; line-height: 1.3; }
  }
  body.clean .ov, body.clean button { display: none !important; }
  #fps { top: calc(10px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left)); font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: rgba(236, 233, 226, 0.6); white-space: pre; transition: none; text-shadow: 0 0 3px #000; }
  #fps.off { display: none; }
  #err { inset: 0; display: none; place-items: center; text-align: center; padding: 2em; font-style: italic; color: var(--dim); }
</style>

<body>
<canvas id="c" aria-label="A game of Nim at a polished marble table"></canvas>
<div id="still" class="ov"></div>
<script>
// Size the opening still so it sits exactly where the scene will draw (see frameCamera in
// src/main.js). Lengths are in units of the lens's half-width; the still spans ±1.3 × ±1
// (landscape) or ±1 × ±2.5 (portrait), and the screen shows ±1 across, or ±aspect/1.845
// past 1.845:1. Outside the shapes it was rendered for, it is scaled up to still cover.
(function () {
  var el = document.getElementById('still');
  function fit() {
    var w = innerWidth, h = innerHeight, a = w / h, wide = a >= 1;
    var bx = wide ? 1.3 : 1, by = wide ? 1 : 2.5;
    var hx = wide && a > 1.845 ? a / 1.845 : 1;
    var px = Math.max(w / (2 * hx), w / (2 * bx), h / (2 * by));
    el.style.backgroundImage = 'url(docs/opening-' + (wide ? 'wide' : 'portrait') + '.jpg)';
    el.style.backgroundSize = 2 * bx * px + 'px ' + 2 * by * px + 'px';
  }
  fit();
  addEventListener('resize', fit);
})();
</script>
<div id="loading" class="ov" role="progressbar" aria-label="Loading"><b></b></div>
<script>setTimeout(function () { document.getElementById('loading').classList.add('go'); }, 30);</script>
<div id="title" class="ov" role="dialog" aria-label="Settings" aria-hidden="true">
  <h1>NIM</h1>
  <p><span>In turns, take as many matches as you want from any one row.</span> <span>The player who picks the last match loses.</span></p>
  <div class="modes" role="group" aria-label="Mode">
    <button id="mode-ai" class="mode" type="button" aria-pressed="false">one player</button>
    <button id="mode-two" class="mode" type="button" aria-pressed="false">two players</button>
    <button id="mode-auto" class="mode" type="button" aria-pressed="false">autoplay</button>
  </div>
  <footer class="credit"><span>Original scene from <cite>Last Year at Marienbad</cite> (1961), made by <a href="https://x.com/neilsonks" target="_blank" rel="noopener">Neilson Koerner-Safrata</a></span></footer>
</div>
<div id="sub" class="ov" aria-live="polite"></div>
<div class="btns">
  <button id="clear" type="button">clear</button>
  <button id="take" type="button">take</button>
  <button id="protest" type="button" lang="fr">Non, c'est impossible</button>
</div>
<button id="speed" type="button" aria-label="Autoplay speed">1x</button>
<button id="touch-orbit" class="show" type="button" aria-pressed="false" hidden>Orbit</button>
<button id="debug" type="button" aria-label="Show the animation rig" aria-pressed="false" title="debug"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2"/><circle cx="10.5" cy="9" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6.9 15.9 9.6 11.1M12.6 8.2 15.9 6.8"/></svg></button>
<button id="gear" class="show" type="button" aria-label="How to play and settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 7.4a4.6 4.6 0 0 1 8.9 1.6c0 3-4.5 3.6-4.5 6.6"/><circle cx="12" cy="20" r="0.5" fill="currentColor"/></svg></button>
<div id="fps" class="ov"></div>
<div id="err" class="ov"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
